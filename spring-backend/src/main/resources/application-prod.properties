# Production Environment Profile

# PostgreSQL Configuration for Production
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${POSTGRES_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scanmyfood}}}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:${SPRING_DATASOURCE_USERNAME:postgres}}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# Storage Configuration for Production (Firebase Storage)
storage.type=${STORAGE_TYPE:firebase}
firebase.storage.bucket-name=${FIREBASE_STORAGE_BUCKET:foodscanai-d28bc.firebasestorage.app}

# Application Base URL for Production deployment
app.base-url=${APP_BASE_URL:https://scanmyfood-prod.up.railway.app}

# Logging (Production level)
logging.level.org.springframework=WARN
logging.level.com.scanmyfood.backend=INFO
