# User Acceptance Testing (UAT) Environment Profile

# PostgreSQL Configuration for Railway UAT
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${POSTGRES_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scanmyfood}}}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:${SPRING_DATASOURCE_USERNAME:postgres}}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# Storage Configuration for UAT (Firebase Storage)
storage.type=${STORAGE_TYPE:firebase}
firebase.storage.bucket-name=${FIREBASE_STORAGE_BUCKET:foodscanai-d28bc.appspot.com}
storage.local.base-dir=${STORAGE_LOCAL_BASE_DIR:/tmp/scanmyfood-uploads}

# Application Base URL for UAT deployment
app.base-url=${APP_BASE_URL:https://scanmyfood-uat.up.railway.app}

# Logging
logging.level.com.scanmyfood.backend=INFO
logging.level.com.scanmyfood.backend.mapper=DEBUG
