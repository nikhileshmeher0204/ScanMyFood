# Local Development Environment Profile

# PostgreSQL Configuration for Local Dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scanmyfood}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# Storage Configuration (Local fallback)
storage.type=${STORAGE_TYPE:local}
storage.local.base-dir=${STORAGE_LOCAL_BASE_DIR:./uploads}
firebase.storage.bucket-name=${FIREBASE_STORAGE_BUCKET:foodscanai-d28bc.appspot.com}

# Base URL for local dev (Android Emulator & local REST)
app.base-url=${APP_BASE_URL:http://10.0.2.2:8080}

# Logging
logging.level.com.scanmyfood.backend=DEBUG
logging.level.com.scanmyfood.backend.mapper=DEBUG
