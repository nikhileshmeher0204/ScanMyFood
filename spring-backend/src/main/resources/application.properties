spring.application.name=ScanMyFood Backend

# Default Active Profile (overridden by SPRING_PROFILES_ACTIVE env var in Railway)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Common Jackson Configuration
spring.jackson.property-naming-strategy=com.fasterxml.jackson.databind.PropertyNamingStrategies.SnakeCaseStrategy

# Common MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Common Google Cloud Configuration
google.cloud.project-id=${GCP_PROJECT_ID:}
google.cloud.location=${GCP_LOCATION:us-central1}

# Common Server Port Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Common Spring AI MCP Server Configuration
spring.ai.mcp.server.name=scanmyfood-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-message-endpoint=/mcp/messages
